services:
  - type: web
    name: libreshelf-backend
    runtime: docker
    rootDir: Backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: libreshelf-db
          property: connectionString

databases:
  - name: libreshelf-db
    plan: free
    databaseName: libreshelf
    user: libreshelf
